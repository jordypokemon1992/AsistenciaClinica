<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Control de Asistencia Hospitalaria</title>
    <meta name="description" content="Sistema de asistencia médica para alumnos en unidades hospitalarias con geocerca GPS, registro de dispositivo único por matrícula y panel docente." />
    <meta property="og:title" content="Control de Asistencia Hospitalaria" />
    <meta property="og:description" content="Sistema de asistencia médica para alumnos en unidades hospitalarias con geocerca GPS, registro de dispositivo único por matrícula y panel docente." />
    
    <!-- PWA & Shortcut Icons for iOS & Android -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Mobile & PWA Meta Tags -->
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Asistencia" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <div id="root">
      <div id="loading-fallback" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#0284c7,#0369a1);display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 10px 25px -5px rgba(2,132,199,0.5);">
          <svg style="width:36px;height:36px;fill:none;stroke:#ffffff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24">
            <path d="M12 6v12M6 12h12" />
          </svg>
        </div>
        <h1 style="font-size:20px;font-weight:700;margin:0 0 6px 0;letter-spacing:-0.02em;color:#ffffff;">ClinicasTrack</h1>
        <p style="font-size:13px;color:#94a3b8;margin:0 0 24px 0;max-width:280px;">Control de Asistencia Hospitalaria</p>
        <div id="loading-spinner" style="width:32px;height:32px;border:3px solid rgba(56,189,248,0.2);border-top-color:#38bdf8;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <div id="loading-recovery" style="display:none;margin-top:20px;max-width:320px;">
          <p style="font-size:13px;color:#cbd5e1;margin-bottom:14px;line-height:1.4;">Detectamos una versión previa en la caché del navegador.</p>
          <button onclick="window.cleanCacheAndReload()" style="background:#0284c7;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(2,132,199,0.4);">
            Actualizar y Cargar
          </button>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script>
      window.cleanCacheAndReload = function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) { caches.delete(keys[i]); }
            });
          }
        } catch(e) {}
        setTimeout(function() {
          window.location.reload(true);
        }, 200);
      };

      // If React doesn't mount within 4 seconds, show recovery button
      setTimeout(function() {
        var fallback = document.getElementById('loading-fallback');
        if (fallback) {
          var rec = document.getElementById('loading-recovery');
          var spin = document.getElementById('loading-spinner');
          if (rec) rec.style.display = 'block';
          if (spin) spin.style.display = 'none';
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
